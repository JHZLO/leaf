[package]
name = "leaf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leaf-project.workspace = true
serde_json.workspace = true
smol.workspace = true
# The grammars leaf highlights; json comes with the base tree-sitter feature.
gpui-kit = { workspace = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-kotlin",
    "tree-sitter-java",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-sql",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-css",
] }
gpui-pre-platform.workspace = true
