[workspace]
members = ["crates/project", "crates/app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
leaf-project = { path = "crates/project" }
gpui-kit = "=0.7.3"
# This Mac has only the Command Line Tools (no Xcode metal compiler), so shaders compile at startup.
gpui-pre-platform = { version = "=0.3.9", features = ["runtime_shaders"] }
ignore = "0.4"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the graph through gpui-component; carries watcher batches to the UI thread.
smol = "2"
tempfile = "3"
trash = "5"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
